#flyway
flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: true
  validate-on-migrate: true

#db connect
datasource:
  url: jdbc:postgresql://localhost:5432/user_service
  username: postgres
  password: postgres
  driver-class-name: org.postgresql.Driver

#redis caching
data:
  redis:
    host: localhost
    port: 6379
    password:
cache:
  type: redis